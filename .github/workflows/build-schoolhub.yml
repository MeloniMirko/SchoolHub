name: Build SchoolHub Windows EXE

on:
  push:
    branches:
      - schoolhub-build
    paths:
      - ".github/workflows/build-schoolhub.yml"
      - ".schoolhub-v2.2/**"
      - ".schoolhub-source-audit/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct base source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem ".schoolhub-v2.2\source.part*" | Sort-Object Name
          if ($parts.Count -ne 31) { throw "Expected 31 source parts, got $($parts.Count)" }
          $b64 = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) { [void]$b64.Append((Get-Content $part.FullName -Raw).Trim()) }
          [IO.File]::WriteAllBytes("source.tar.xz", [Convert]::FromBase64String($b64.ToString()))
          $actual = (Get-FileHash "source.tar.xz" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne "11a25bb9e4b54868a2754b15d3c665b5384fb24cc06946a3fb0f29af6f135ba8") { throw "Source hash mismatch" }
          tar -xf "source.tar.xz"

      - name: Apply SchoolHub 2.6.2 Update Restart + Animated Intro source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item ".schoolhub-source-audit\src\schoolhub_gui.py" ".\src\schoolhub_gui.py" -Force
          Copy-Item ".schoolhub-source-audit\src\workspace.py" ".\src\workspace.py" -Force
          Copy-Item ".schoolhub-source-audit\SchoolHub.spec" ".\SchoolHub.spec" -Force
          Copy-Item ".schoolhub-source-audit\version_info.txt" ".\version_info.txt" -Force
          Copy-Item ".schoolhub-source-audit\requirements.txt" ".\requirements.txt" -Force
          Copy-Item ".schoolhub-source-audit\intro.tcl" ".\intro.tcl" -Force
          if (Test-Path ".schoolhub-source-audit\tests") {
            Copy-Item ".schoolhub-source-audit\tests\*" ".\tests\" -Recurse -Force
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Pillow

      - name: Prepare animated boot intro
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('.')
          gui_path = root / 'src' / 'schoolhub_gui.py'
          spec_path = root / 'SchoolHub.spec'

          gui = gui_path.read_text(encoding='utf-8')
          if 'APP_VERSION = "2.6.2"' not in gui:
              raise SystemExit('APP_VERSION 2.6.2 marker not found')

          (root / 'VERSION.txt').write_text('2.6.2\n', encoding='utf-8')

          logo = Image.open(root / 'schoolhub_icon.png').convert('RGBA')
          canvas = Image.new('RGBA', (680, 410), (8, 17, 32, 255))
          draw = ImageDraw.Draw(canvas)
          draw.rounded_rectangle((8, 8, 671, 401), radius=34, fill=(10, 24, 44, 255), outline=(35, 124, 255, 255), width=2)
          draw.rounded_rectangle((34, 326, 646, 358), radius=16, fill=(17, 39, 67, 255), outline=(43, 103, 177, 255), width=1)

          logo.thumbnail((185, 185), Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo, ((680-logo.width)//2, 38))

          def font(size, bold=False):
              candidates = [
                  'C:/Windows/Fonts/segoeuib.ttf' if bold else 'C:/Windows/Fonts/segoeui.ttf',
                  'C:/Windows/Fonts/arialbd.ttf' if bold else 'C:/Windows/Fonts/arial.ttf',
              ]
              for candidate in candidates:
                  try:
                      return ImageFont.truetype(candidate, size)
                  except Exception:
                      pass
              return ImageFont.load_default()

          title_font = font(36, True)
          sub_font = font(16, False)
          small_font = font(12, False)
          title = 'SchoolHub'
          box = draw.textbbox((0, 0), title, font=title_font)
          draw.text(((680-(box[2]-box[0]))/2, 225), title, fill=(244, 248, 255, 255), font=title_font)
          subtitle = 'UltraLight · ambiente sicuro'
          box = draw.textbbox((0, 0), subtitle, font=sub_font)
          draw.text(((680-(box[2]-box[0]))/2, 276), subtitle, fill=(161, 188, 220, 255), font=sub_font)
          draw.text((34, 374), 'SchoolHub 2.6.2 - Avvio applicazione', fill=(119, 151, 188, 255), font=small_font)
          canvas.convert('RGB').save(root / 'schoolhub_splash.png', 'PNG')

          spec = spec_path.read_text(encoding='utf-8')
          if 'Splash(' in spec:
              raise SystemExit('Spec already has Splash')
          exe_marker = 'exe = EXE('
          idx = spec.find(exe_marker)
          if idx < 0:
              raise SystemExit('EXE target not found')
          from_marker = 'from pathlib import Path'
          if from_marker not in spec:
              spec = from_marker + '\n' + spec
              idx = spec.find(exe_marker)
          splash_block = """class AnimatedSplash(Splash):
              def generate_script(self):
                  script = super().generate_script()
                  animation = Path('.schoolhub-source-audit/intro.tcl').read_text(encoding='utf-8')
                  script += '\\n' + animation
                  Path(self.script_name).write_text(script, encoding='utf-8')
                  return script

          splash = AnimatedSplash(
              'schoolhub_splash.png',
              binaries=a.binaries,
              datas=a.datas,
              text_pos=(46, 305),
              text_size=10,
              text_color='#d7e8ff',
              text_font='Segoe UI',
              minify_script=True,
              always_on_top=True,
          )

          """
          spec = spec[:idx] + splash_block + spec[idx:]
          open_pos = spec.find('(', spec.find(exe_marker))
          spec = spec[:open_pos+1] + '\n    splash,\n    splash.binaries,' + spec[open_pos+1:]
          spec_path.write_text(spec, encoding='utf-8')
          print('Animated boot intro OK')
          '@ | Set-Content ".schoolhub-v2.2\patch_24.py" -Encoding UTF8
          python ".schoolhub-v2.2\patch_24.py"

      - name: Normalize Windows tests
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          media = Path('tests/test_media_streaming.py')
          text = media.read_text(encoding='utf-8-sig')
          if 'sys.path.insert' not in text:
              text = text.replace('from pathlib import Path', "from pathlib import Path\nimport sys\nsys.path.insert(0, str(Path(__file__).resolve().parents[1] / 'src'))", 1)
          media.write_text(text, encoding='utf-8')

          p = Path('tests/test_schoolhub.py')
          lines = p.read_text(encoding='utf-8-sig').splitlines()
          out = []
          for line in lines:
              indent = line[:len(line)-len(line.lstrip())]
              if '.creating-cleanup-' in line and line.lstrip().startswith('if '):
                  out.append(indent + "if '.creating-cleanup-' in os.fspath(dst):")
              elif '.locking-cleanup-' in line and line.lstrip().startswith('if '):
                  out.append(indent + "if '.locking-cleanup-' in os.fspath(dst):")
              else:
                  out.append(line)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          '@ | Set-Content ".schoolhub-v2.2\normalize.py" -Encoding UTF8
          python ".schoolhub-v2.2\normalize.py"

      - name: UltraLight privacy audit
        shell: pwsh
        run: |
          @'
          import pathlib, re
          root = pathlib.Path('.')
          files = [root/'src'/'schoolhub_gui.py', root/'src'/'workspace.py']
          patterns = [
              re.compile(r'github_pat_[A-Za-z0-9_]{20,}'),
              re.compile(r'gh[pousr]_[A-Za-z0-9]{20,}'),
              re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----'),
          ]
          for p in files:
              text = p.read_text(encoding='utf-8')
              for pattern in patterns:
                  if pattern.search(text):
                      raise SystemExit(f'Privacy audit failed in {p}')

          gui = (root/'src'/'schoolhub_gui.py').read_text(encoding='utf-8')
          workspace = (root/'src'/'workspace.py').read_text(encoding='utf-8')
          spec = (root/'SchoolHub.spec').read_text(encoding='utf-8')
          version_info = (root/'version_info.txt').read_text(encoding='utf-8')
          installer = (root/'.schoolhub-source-audit'/'installer'/'SchoolHub.iss').read_text(encoding='utf-8')

          checks = {
              'safe default remote': 'DEFAULT_REMOTE = ""' in gui,
              'auto sync default off': '"auto_sync": False' in gui,
              'auto start default off': '"auto_start": False' in gui,
              'version 2.6.2': 'APP_VERSION = "2.6.2"' in gui,
              'daily update cache': 'UPDATE_CHECK_INTERVAL_SECONDS = 24 * 60 * 60' in gui,
              'minute clock': 'after(60000, self.update_clock)' in gui,
              'single instance': 'def _acquire_single_instance()' in gui,
              'setup updater wait': 'wait_old_process' in gui and 'SchoolHub-Setup.exe' in gui,
              'instant unlock UI': 'def workspace_session_lock' in gui,
              'instant unlock core': 'def session_lock' in workspace and 'if self.has_plaintext:' in workspace,
              'public remote preserved': 'Preserve the repository explicitly saved by the user' in gui,
              'verified windows startup': 'Windows non ha confermato il comando di avvio automatico' in gui,
              'pending autosync after unlock': 'def _auto_sync_after_unlock' in gui,
              'gcm runtime config': 'GCM_INTERACTIVE' in gui and 'credential.helper' in gui,
              'gcm bundled in spec': '("vendor/gcm", "vendor/gcm")' in spec,
              'verified settings readback': 'mismatches = {' in gui and 'verified = load_config()' in gui,
              'settings success popup': 'SALVATO CORRETTAMENTE' in gui and 'def _show_settings_saved_popup' in gui,
              'settings save button': 'text="✓  SALVA"' in gui,
              'settings save always visible': 'github_head = tk.Frame(card' in gui and 'MODIFICHE NON SALVATE' in gui,
              'settings ctrl-s': 'Control-s' in gui and 'Control-S' in gui,
              'correct SchoolHub release api': 'MeloniMirko/SchoolHub/releases/latest' in gui,
              'git lfs runtime config': 'filter.lfs.process' in gui and 'git-lfs filter-process' in gui,
              'git lfs media tracking': 'LFS_MEDIA_PATTERNS' in gui and 'def _prepare_git_lfs' in gui,
              'git lfs bundled in spec': '("vendor/lfs", "vendor/lfs")' in spec,
              'legacy verify streaming': 'payload = source.read_bytes()' not in workspace,
              'windows extended paths': 'def _io_path' in workspace and '\\\\?\\' in workspace,
              'short temp filenames': 'def _short_temp_near' in workspace and '.~sh-' in workspace,
              'incremental plaintext sync': 'def apply_plaintext_paths_from_tree' in workspace,
              'git core longpaths': 'core.longpaths' in gui,
              'editor safe persist': 'remote_paths=None' in gui and 'apply_plaintext_paths_from_tree' in gui,
              'lfs locks disabled': '["config", "lfs.locksverify", "false"]' in gui,
              'github browser auth retry': 'def _github_browser_login' in gui and 'def _push_with_auth_retry' in gui and '"--force"' in gui,
              'guided github onboarding': 'def show_github_setup' in gui and 'ACCEDI A GITHUB' in gui and 'SALVA E CONTINUA' in gui,
              'github repo branch discovery': 'def _github_account_and_repositories' in gui and 'def _github_repository_branches' in gui,
              'github token memory only': 'Authorization": "Bearer " + token' in gui and 'github_token' not in gui,
              'device status branch': 'DEVICE_STATUS_BRANCH = "schoolhub-status"' in gui,
              'device dashboard': 'def show_devices' in gui and 'def _publish_device_record' in gui and 'def _read_device_records' in gui,
              'device privacy': 'username Windows' in gui and 'device_id' in gui,
              'device online outdated': 'def _device_presence' in gui and 'AGGIORNAMENTO RICHIESTO' in gui,
              'windows installer': 'WizardStyle=modern' in installer and 'DefaultDirName={localappdata}\\Programs\\SchoolHub' in installer,
              'setup based updater': 'SchoolHub-Setup.exe' in gui and 'def _create_preupdate_backup' in gui and '/VERYSILENT' in gui,
              'stable beta channels': '"update_channel": "stable"' in gui and 'values=["stable", "beta"]' in gui and 'RELEASES_API' in gui,
              'diagnostic export': 'def export_diagnostics' in gui and 'schoolhub-sanitized.log' in gui and '_redact_diagnostic_text' in gui,
              'safe repair': 'def repair_schoolhub' in gui and 'NON verranno eliminati' in gui,
              'support error codes': 'SH-GIT-101' in gui and 'SH-SYNC-302' in gui and 'SH-UPD-401' in gui,
              'windows file metadata': 'version="version_info.txt"' in spec and "ProductVersion', u'2.6.2'" in version_info,
              'safe uninstall': 'CurUninstallStepChanged' in installer and 'MB_DEFBUTTON2' in installer,
              'nondefault branch fetch': 'fetch_ref = f"refs/heads/{requested}:refs/remotes/origin/{requested}"' in gui and '["fetch", "--depth", "1", "origin", fetch_ref]' in gui,
              'branch error lists remotes': '"ls-remote", "--heads", remote' in gui,
              'responsive canvas': 'self.content_canvas = tk.Canvas' in gui and 'content_scrollbar' in gui,
              'responsive sidebar': 'self.sidebar_compact_width = 76' in gui and 'def _apply_responsive_layout' in gui,
              'responsive small window': 'self.root.minsize(720, 520)' in gui,
              'lazy crypto': 'def _aesgcm()' in workspace and 'AESGCM(key)' not in workspace,
              'lean hidden imports': 'hiddenimports = []' in spec,
              'boot splash': 'Splash(' in spec and 'splash.binaries' in spec,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('UltraLight audit failed: ' + ', '.join(failed))
          print('UltraLight audit OK:', ', '.join(checks))
          '@ | Set-Content ".schoolhub-v2.2\audit_24.py" -Encoding UTF8
          python ".schoolhub-v2.2\audit_24.py"

      - name: Bundle official MinGit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ "User-Agent" = "SchoolHub-Build/2.4" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/git-for-windows/git/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '^MinGit-.*-64-bit\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Official 64-bit MinGit asset not found" }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile "MinGit.zip"
          New-Item -ItemType Directory -Force "vendor\git" | Out-Null
          Expand-Archive -Path "MinGit.zip" -DestinationPath "vendor\git" -Force
          & "vendor\git\cmd\git.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled MinGit failed" }

      - name: Bundle Git Credential Manager
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ "User-Agent" = "SchoolHub-Build/2.4" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/git-ecosystem/git-credential-manager/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "gcm-win-x64-*.zip" -and $_.name -notlike "*symbols*" } | Select-Object -First 1
          if (-not $asset) { throw "Git Credential Manager x64 ZIP not found" }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile "GCM.zip"
          New-Item -ItemType Directory -Force "vendor\gcm" | Out-Null
          Expand-Archive -Path "GCM.zip" -DestinationPath "vendor\gcm" -Force
          if (-not (Test-Path "vendor\gcm\git-credential-manager.exe")) { throw "GCM executable missing" }
          & "vendor\gcm\git-credential-manager.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled GCM failed" }

      - name: Bundle Git LFS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ "User-Agent" = "SchoolHub-Build/2.4" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/git-lfs/git-lfs/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "git-lfs-windows-amd64-*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "Git LFS Windows amd64 ZIP not found" }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile "GitLFS.zip"
          New-Item -ItemType Directory -Force "vendor\lfs" | Out-Null
          Expand-Archive -Path "GitLFS.zip" -DestinationPath "vendor\lfs-tmp" -Force
          $lfsExe = Get-ChildItem "vendor\lfs-tmp" -Filter "git-lfs.exe" -Recurse | Select-Object -First 1
          if (-not $lfsExe) { throw "git-lfs.exe missing from archive" }
          Copy-Item $lfsExe.FullName "vendor\lfs\git-lfs.exe" -Force
          & "vendor\lfs\git-lfs.exe" version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Git LFS failed" }

      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm SchoolHub.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (!(Test-Path "dist\SchoolHub.exe")) { throw "SchoolHub.exe missing" }
          $size = (Get-Item "dist\SchoolHub.exe").Length
          $mb = [math]::Round($size / 1MB, 1)
          Write-Host "SchoolHub.exe size: $mb MB"
          if ($size -gt 160MB) { throw "UltraLight size budget exceeded: $mb MB" }
          $vi = (Get-Item ".\dist\SchoolHub.exe").VersionInfo
          Write-Host "EXE ProductVersion: $($vi.ProductVersion) Company: $($vi.CompanyName)"
          if ($vi.ProductVersion -notlike "2.6.2*") { throw "EXE ProductVersion metadata missing" }
          if ($vi.CompanyName -ne "SchoolHub") { throw "EXE CompanyName metadata missing" }

      - name: Self-test EXE
        shell: pwsh
        run: |
          $out = Join-Path $PWD "dist\selftest.json"
          $p = Start-Process ".\dist\SchoolHub.exe" -ArgumentList @("--self-test", $out) -PassThru -Wait
          if (Test-Path $out) {
            $result = Get-Content $out -Raw | ConvertFrom-Json
            $result | ConvertTo-Json -Depth 8
          } else {
            throw "Self-test did not create selftest.json (exit $($p.ExitCode))"
          }
          if ($p.ExitCode -ne 0) { throw "Self-test process failed: $($p.ExitCode) - $($result.error)" }
          if (-not $result.ok) { throw "Self-test reported failure: $($result.error)" }
          if (-not $result.checks.vault_roundtrip) { throw "Vault failed" }
          if (-not $result.checks.media_streaming) { throw "Media streaming failed" }
          if (-not $result.checks.legacy_stream_unlock) { throw "Legacy SHENC1 streaming unlock failed" }
          if (-not $result.checks.git_bundled) { throw "Bundled Git failed" }
          if (-not $result.checks.git_credential_manager) { throw "Git Credential Manager failed" }
          if (-not $result.checks.git_lfs) { throw "Git LFS runtime failed" }
          if (-not $result.checks.media_git_lfs) { throw "MP3/MP4 Git LFS test failed" }
          if (-not $result.checks.windows_long_media_path) { throw "Windows long MP3 path test failed" }
          if (-not $result.checks.editor_safe_incremental_sync) { throw "Editor-safe incremental sync test failed" }
          if (-not $result.checks.lfs_locks_disabled) { throw "Git LFS locksverify disable test failed" }
          if (-not $result.checks.github_browser_login_command) { throw "GCM GitHub browser login command test failed" }
          if (-not $result.checks.update_channel_default) { throw "Stable update channel default failed" }
          if (-not $result.checks.support_error_codes) { throw "Support error codes failed" }
          if (-not $result.checks.diagnostic_redaction) { throw "Diagnostic redaction failed" }
          if (-not $result.checks.nondefault_branch_clone) { throw "Non-default branch clone regression failed" }
          if (-not $result.checks.responsive_ui_core) { throw "Responsive UI core test failed" }
          if (-not $result.checks.safe_default_remote) { throw "Privacy remote failed" }
          if ($result.checks.version -ne "2.6.2") { throw "Wrong version" }

      - name: Frozen independent restart regression
        shell: pwsh
        run: |
          $out = Join-Path $PWD "dist\restart-smoke.json"
          $p = Start-Process ".\dist\SchoolHub.exe" -ArgumentList @("--restart-smoke", $out) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Restart parent failed" }
          $deadline = (Get-Date).AddSeconds(60)
          while (!(Test-Path $out) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (!(Test-Path $out)) { throw "Restarted app did not start after parent exit" }
          $result = Get-Content $out -Raw | ConvertFrom-Json
          if (!$result.ok) { throw "Restarted app lost its Python runtime" }

      - name: GUI idle smoke test
        shell: pwsh
        run: |
          $p = Start-Process ".\dist\SchoolHub.exe" -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          if ($p.HasExited) { throw "GUI exited at startup: $($p.ExitCode)" }

          Add-Type -Namespace SchoolHubSmoke -Name Native -MemberDefinition '[System.Runtime.InteropServices.DllImport("user32.dll", SetLastError=true)] public static extern bool MoveWindow(System.IntPtr hWnd, int X, int Y, int nWidth, int nHeight, bool bRepaint);'
          $p.Refresh()
          if ($p.MainWindowHandle -ne [IntPtr]::Zero) {
            [SchoolHubSmoke.Native]::MoveWindow($p.MainWindowHandle, 50, 50, 760, 540, $true) | Out-Null
            Start-Sleep -Seconds 3
            $p.Refresh()
            if ($p.HasExited) { throw "GUI exited after compact resize: $($p.ExitCode)" }
            Write-Host "Compact responsive resize: 760x540 OK"
          } else {
            Write-Host "MainWindowHandle unavailable; startup smoke test still passed"
          }

          $procs = @(Get-Process -Name "SchoolHub" -ErrorAction SilentlyContinue)
          $mem = ($procs | Measure-Object -Property WorkingSet64 -Sum).Sum
          $cpu1 = ($procs | Measure-Object -Property CPU -Sum).Sum
          Start-Sleep -Seconds 5
          $procs2 = @(Get-Process -Name "SchoolHub" -ErrorAction SilentlyContinue)
          $cpu2 = ($procs2 | Measure-Object -Property CPU -Sum).Sum
          $delta = [double]$cpu2 - [double]$cpu1
          $memMb = [math]::Round(([double]$mem / 1MB), 1)
          Write-Host "Idle working set: $memMb MB"
          Write-Host "CPU used over 5s idle window: $([math]::Round($delta, 3)) s"

          if ($mem -gt 200MB) { throw "Idle RAM budget exceeded: $memMb MB" }
          if ($delta -gt 1.0) { throw "Idle CPU budget exceeded: $delta s over 5s" }

          Get-Process -Name "SchoolHub" -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc ".schoolhub-source-audit\installer\SchoolHub.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          if (!(Test-Path ".\dist\SchoolHub-Setup.exe")) { throw "SchoolHub-Setup.exe missing" }
          Write-Host "Installer size: $([math]::Round((Get-Item '.\dist\SchoolHub-Setup.exe').Length / 1MB, 1)) MB"
          $setupVi = (Get-Item ".\dist\SchoolHub-Setup.exe").VersionInfo
          Write-Host "Setup ProductVersion: $($setupVi.ProductVersion) Company: $($setupVi.CompanyName)"
          if ($setupVi.ProductVersion -notlike "2.6.2*") { throw "Setup ProductVersion metadata missing" }
          if ($setupVi.CompanyName.Trim() -ne "SchoolHub") { throw "Setup CompanyName metadata missing" }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\SchoolHub.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  SchoolHub.exe" | Set-Content ".\dist\SchoolHub.exe.sha256.txt" -Encoding ASCII
          $setupHash = (Get-FileHash ".\dist\SchoolHub-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$setupHash  SchoolHub-Setup.exe" | Set-Content ".\dist\SchoolHub-Setup.exe.sha256.txt" -Encoding ASCII
          Get-Content ".\dist\SchoolHub.exe.sha256.txt"
          Get-Content ".\dist\SchoolHub-Setup.exe.sha256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolHub-Windows-v2.6.2-Responsive
          path: |
            dist/SchoolHub.exe
            dist/SchoolHub.exe.sha256.txt
            dist/SchoolHub-Setup.exe
            dist/SchoolHub-Setup.exe.sha256.txt
            dist/selftest.json
            schoolhub_splash.png
          compression-level: 0
          retention-days: 30

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "schoolhub-v2.6.2"
          $notes = "SchoolHub 2.6.2: riavvio indipendente dopo aggiornamento per evitare il riuso della cartella temporanea Python eliminata; intro animata centrata attiva durante l estrazione e l avvio; finestra principale nascosta fino al completamento del layout. Corregge selezione account GitHub e recupero autenticazione SH-GIT-101; chiarisce che i repository pubblici sono consentiti. Include test Windows del riavvio EXE e mantiene le correzioni branch e responsive 2.6.1. Per passare da una versione precedente, scaricare ed eseguire SchoolHub-Setup.exe dopo aver chiuso SchoolHub; il vecchio updater non contiene ancora la correzione."
          if (gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null) {
            gh release upload $tag ".\dist\SchoolHub.exe#SchoolHub.exe" ".\dist\SchoolHub.exe.sha256.txt#SchoolHub.exe.sha256.txt" ".\dist\SchoolHub-Setup.exe#SchoolHub-Setup.exe" ".\dist\SchoolHub-Setup.exe.sha256.txt#SchoolHub-Setup.exe.sha256.txt" --clobber --repo "$env:GITHUB_REPOSITORY"
            gh release edit $tag --title "SchoolHub 2.6.2 Update Restart + Animated Intro" --notes $notes --latest --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag ".\dist\SchoolHub.exe#SchoolHub.exe" ".\dist\SchoolHub.exe.sha256.txt#SchoolHub.exe.sha256.txt" ".\dist\SchoolHub-Setup.exe#SchoolHub-Setup.exe" ".\dist\SchoolHub-Setup.exe.sha256.txt#SchoolHub-Setup.exe.sha256.txt" --target "$env:GITHUB_SHA" --title "SchoolHub 2.6.2 Update Restart + Animated Intro" --notes $notes --latest --repo "$env:GITHUB_REPOSITORY"
          }
